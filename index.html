<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Budget hebdo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#1456c8">
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#0b2147;--mute:#5a6f94;--line:#d4e1fa;--blue:#1456c8;--blue2:#0b3a8f;--soft:#e3edff;--ok:#16824a;--warn:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08142b;--card:#0f2247;--ink:#e8f0ff;--mute:#9db3dc;--line:#22407a;--blue:#4f8dff;--blue2:#7aa8ff;--soft:#162d5c;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08142b;--card:#0f2247;--ink:#e8f0ff;--mute:#9db3dc;--line:#22407a;--blue:#4f8dff;--blue2:#7aa8ff;--soft:#162d5c;--ok:#4ade80;--warn:#fb923c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{background:var(--blue);color:#fff;padding:18px 0 22px;border-radius:0 0 22px 22px}
header h1{margin:0 0 12px;font-size:20px;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer}
.nav .w{flex:1;text-align:center;font-weight:600}
.nav .w small{display:block;font-weight:400;opacity:.85}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tot div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px}
.tot b{display:block;font-size:15px}
.bar{display:flex;gap:8px;margin:14px 0}
.bar button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:600;font-size:15px;cursor:pointer}
.bar button.on{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit}
.head .n{flex:1}
.head .n b{font-size:16px}
.head .n small{display:block;color:var(--mute);font-size:12.5px}
.head .r{text-align:right;font-weight:700;font-size:15px}
.head .r small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.neg{color:var(--warn)}
.pg{height:6px;background:var(--soft);margin:0 14px 12px;border-radius:6px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--blue);border-radius:6px}
.days{border-top:1px solid var(--line);padding:6px 14px 12px}
.d{padding:10px 0;border-bottom:1px dashed var(--line)}
.d:last-child{border-bottom:0}
.d .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d .dn{width:58px;font-weight:600;font-size:14px}
.d input[type=number]{width:88px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding:7px 10px;border-radius:999px;background:var(--soft);cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.chk.off{opacity:.45}
.desc{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.set h2{margin:0 0 4px;font-size:16px}
.set p{margin:0 0 10px;color:var(--mute);font-size:13px}
.sr{display:grid;grid-template-columns:1fr 100px 100px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.sr input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sr.h{color:var(--mute);font-size:12px;margin-bottom:4px}
.hide{display:none}
.hint{color:var(--mute);font-size:12.5px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Budget de la semaine</h1>
<div class="nav"><button id="prev" aria-label="Semaine précédente">‹</button><div class="w" id="wl"></div><button id="next" aria-label="Semaine suivante">›</button></div>
<div class="tot" id="tot"></div>
</div></header>
<main class="wrap">
<div class="bar"><button id="bDep" class="on">Dépenses</button><button id="bSet">Budgets</button></div>
<section id="set" class="set hide"></section>
<section id="list"></section>
<p class="hint">Les données restent sur ce téléphone. Pour installer : menu du navigateur → « Ajouter à l’écran d’accueil ».</p>
</main>
<script>
var CATS=["Goûter","Laoka","Ronono","Mofo maraina","Carburants","Professeur","Rakitra","Fako","Mince","Divers"];
var DESC=["Laoka","Divers"];
var DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
var KEY="budget-hebdo-v1";
var S={cfg:{},weeks:{}};
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)||S}}catch(e){}
S.cfg=S.cfg||{};S.weeks=S.weeks||{};
CATS.forEach(function(c){S.cfg[c]=S.cfg[c]||{budget:0,daily:0}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var off=0,open={},tab="dep";
function pad(n){return n<10?"0"+n:""+n}
function monday(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function wkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt(n){return Math.round(n).toLocaleString("fr-FR")+" Ar"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function getW(k,c){S.weeks[k]=S.weeks[k]||{};if(!S.weeks[k][c]){S.weeks[k][c]=[];for(var i=0;i<7;i++)S.weeks[k][c].push({p:0,c:0,a:"",d:""})}return S.weeks[k][c]}
function amt(x,c){return x.a!==""&&x.a!=null?Number(x.a):Number(S.cfg[c].daily)||0}
function calc(k,c){var w=getW(k,c),sp=0,pend=0;w.forEach(function(x){if(x.p){sp+=amt(x,c);if(!x.c)pend++}});var b=Number(S.cfg[c].budget)||0;return{b:b,sp:sp,rest:b-sp,pend:pend}}
function render(){
var m=monday(),k=wkey(m),e=new Date(m);e.setDate(e.getDate()+6);
var mo=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
document.getElementById("wl").innerHTML=(off===0?"Cette semaine":off===-1?"Semaine dernière":"Semaine")+"<small>"+m.getDate()+" "+mo[m.getMonth()]+" – "+e.getDate()+" "+mo[e.getMonth()]+" "+e.getFullYear()+"</small>";
var tb=0,ts=0;CATS.forEach(function(c){var r=calc(k,c);tb+=r.b;ts+=r.sp});
document.getElementById("tot").innerHTML="<div>Budget<b>"+fmt(tb)+"</b></div><div>Dépensé<b>"+fmt(ts)+"</b></div><div>Reste<b class='"+(tb-ts<0?"neg":"")+"'>"+fmt(tb-ts)+"</b></div>";
var h="";
CATS.forEach(function(c){
var r=calc(k,c),w=getW(k,c),pc=r.b>0?Math.min(100,r.sp/r.b*100):0,hasD=DESC.indexOf(c)>-1;
h+="<div class='card'><button class='head' data-t='"+esc(c)+"'><span class='n'><b>"+esc(c)+"</b><small>"+fmt(r.b)+" · "+fmt(Number(S.cfg[c].daily)||0)+"/jour"+(r.pend?" · "+r.pend+" monnaie(s) à recevoir":"")+"</small></span><span class='r'><span class='"+(r.rest<0?"neg":"")+"'>"+fmt(r.rest)+"</span><small>reste</small></span></button><div class='pg'><i style='width:"+pc+"%'></i></div>";
if(open[c]){
h+="<div class='days'>";
w.forEach(function(x,i){
var dd=new Date(m);dd.setDate(dd.getDate()+i);
var a="data-c='"+esc(c)+"' data-i='"+i+"'";
h+="<div class='d'><div class='row'><span class='dn'>"+DAYS[i]+" "+dd.getDate()+"</span>"+
"<input type='number' inputmode='numeric' min='0' placeholder='"+(Number(S.cfg[c].daily)||0)+"' value='"+esc(x.a)+"' "+a+" data-f='a' aria-label='Montant donné'>"+
"<label class='chk'><input type='checkbox' "+a+" data-f='p' "+(x.p?"checked":"")+">Payé</label>"+
"<label class='chk"+(x.p?"":" off")+"'><input type='checkbox' "+a+" data-f='c' "+(x.c?"checked":"")+(x.p?"":" disabled")+">Monnaie reçue</label></div>"+
(hasD?"<input class='desc' type='text' "+a+" data-f='d' value='"+esc(x.d)+"' placeholder='"+(c==="Laoka"?"Décris l’opération (ex. poisson, légumes…)":"Description de la dépense")+"'>":"")+
"</div>"});
h+="</div>"}
h+="</div>"});
document.getElementById("list").innerHTML=h;
}
function renderSet(){
var h="<h2>Budgets de la semaine</h2><p>Définis le budget total et le montant à donner chaque jour pour chaque dépense.</p><div class='sr h'><span>Dépense</span><span>Budget</span><span>Par jour</span></div>";
CATS.forEach(function(c){h+="<div class='sr'><span>"+esc(c)+"</span><input type='number' inputmode='numeric' min='0' data-cfg='budget' data-c='"+esc(c)+"' value='"+(S.cfg[c].budget||"")+"' placeholder='0'><input type='number' inputmode='numeric' min='0' data-cfg='daily' data-c='"+esc(c)+"' value='"+(S.cfg[c].daily||"")+"' placeholder='0'></div>"});
document.getElementById("set").innerHTML=h}
document.getElementById("list").addEventListener("click",function(ev){var b=ev.target.closest(".head");if(b){var c=b.getAttribute("data-t");open[c]=!open[c];render()}});
document.getElementById("list").addEventListener("change",function(ev){
var t=ev.target,c=t.getAttribute("data-c"),f=t.getAttribute("data-f");if(!f)return;
var x=getW(wkey(monday()),c)[Number(t.getAttribute("data-i"))];
if(f==="p"){x.p=t.checked?1:0;if(!x.p)x.c=0}else if(f==="c"){x.c=t.checked?1:0}else x[f]=t.value;
save();render()});
document.getElementById("set").addEventListener("change",function(ev){var t=ev.target,f=t.getAttribute("data-cfg");if(!f)return;S.cfg[t.getAttribute("data-c")][f]=Number(t.value)||0;save();render()});
document.getElementById("prev").onclick=function(){off--;render()};
document.getElementById("next").onclick=function(){off++;render()};
function setTab(t){tab=t;document.getElementById("bDep").className=t==="dep"?"on":"";document.getElementById("bSet").className=t==="set"?"on":"";document.getElementById("set").className=t==="set"?"set":"set hide";document.getElementById("list").className=t==="set"?"hide":"";if(t==="set")renderSet()}
document.getElementById("bDep").onclick=function(){setTab("dep")};
document.getElementById("bSet").onclick=function(){setTab("set")};
render();
var any=CATS.some(function(c){return S.cfg[c].budget>0});if(!any)setTab("set");
</script>
</body>
</html>
